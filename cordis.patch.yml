# @shion/dsh-vision-bridge profile bundle patch: a HOST-plane row, so the
# translation hook sees image blocks from EVERY tool on the profile — that is
# the whole point, and it is why the plugin never needs to know which other
# plugins are installed.
#
# id and settings namespace both carry the `shion-` prefix: those two spaces are
# flat per profile with no scope protection of their own.
- insert:
    - id: shion-vision-bridge
      name: '@shion/dsh-vision-bridge'
      config:
        translate: auto
